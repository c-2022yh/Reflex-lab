name = "reflex-lab"
main = "src/worker.mjs"
compatibility_date = "2026-11-02"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "reflex-lab-db"
# Replace this value with the database_id returned by npm run db:create.
database_id = "42543011-0c8b-4ac7-9468-35e2f8cf7adf"
migrations_dir = "migrations"
