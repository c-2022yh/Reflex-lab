name: HW3 Docker CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell

# Serialize runs that publish the same latest tag.
concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # There are no external dependencies or package lockfile.
      - name: Run tests
        run: |
          npm.cmd test
          exit $LASTEXITCODE
      - name: Check JavaScript syntax
        run: |
          node --check server.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check src/worker.mjs
          exit $LASTEXITCODE

  docker:
    needs: test
    runs-on: [self-hosted, Windows, X64]
    env:
      DOCKER_CONTEXT: desktop-linux
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            throw 'Configure the DOCKERHUB_USERNAME repository secret.'
          }
          $image = "${env:DOCKERHUB_USERNAME}/reflex-lab"
          docker build --build-arg "COMMIT_SHA=${env:GITHUB_SHA}" --tag "${image}:latest" --tag "${image}:${env:GITHUB_SHA}" .
          exit $LASTEXITCODE

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push commit SHA tag
        run: |
          docker push "${env:DOCKERHUB_USERNAME}/reflex-lab:${env:GITHUB_SHA}"
          exit $LASTEXITCODE

      - name: Push latest tag
        run: |
          docker push "${env:DOCKERHUB_USERNAME}/reflex-lab:latest"
          exit $LASTEXITCODE

  deploy:
    needs: docker
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
      actions: read
      checks: read
    timeout-minutes: 15
    env:
      DOCKER_CONTEXT: desktop-linux
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DEPLOY_LOG_DIR: outputs/deployment-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Start independent ranking API monitor
        id: monitor_start
        run: |
          node scripts/monitor-deployment.mjs start --dir $env:DEPLOY_LOG_DIR --url http://127.0.0.1:3000/api/scores --sha $env:GITHUB_SHA --post-seconds 30
          exit $LASTEXITCODE
      - name: Deploy and verify the commit image
        id: deployment
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/deploy-recorded.ps1 -Image "${env:DOCKERHUB_USERNAME}/reflex-lab" -CommitSha $env:GITHUB_SHA -LogDirectory $env:DEPLOY_LOG_DIR
          exit $LASTEXITCODE
      - name: Observe until 30 seconds after deployment or rollback
        id: monitor_finish
        if: always()
        run: |
          node scripts/monitor-deployment.mjs finish --dir $env:DEPLOY_LOG_DIR --outcome '${{ steps.deployment.outcome }}'
          exit $LASTEXITCODE
      - name: Publish observation summary
        id: observation
        if: always()
        run: |
          node scripts/monitor-deployment.mjs report --dir $env:DEPLOY_LOG_DIR
          exit $LASTEXITCODE
      - name: Preserve verified local originals outside the runner workspace
        id: archive
        if: always()
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          MONITOR_START_OUTCOME: ${{ steps.monitor_start.outcome }}
          MONITOR_FINISH_OUTCOME: ${{ steps.monitor_finish.outcome }}
          OBSERVATION_OUTCOME: ${{ steps.observation.outcome }}
        run: |
          node scripts/archive-deployment.mjs save --dir $env:DEPLOY_LOG_DIR
          exit $LASTEXITCODE
      - name: Upload a copy of the preserved logs
        id: artifact_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deployment-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.archive.outputs.path || env.DEPLOY_LOG_DIR }}/
          if-no-files-found: error
          retention-days: 30
      - name: Report upload outcome and durable fallback path
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
          ARTIFACT_UPLOAD_OUTCOME: ${{ steps.artifact_upload.outcome }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          MONITOR_START_OUTCOME: ${{ steps.monitor_start.outcome }}
          MONITOR_FINISH_OUTCOME: ${{ steps.monitor_finish.outcome }}
          OBSERVATION_OUTCOME: ${{ steps.observation.outcome }}
        run: |
          node scripts/archive-deployment.mjs status
          exit $LASTEXITCODE
      - name: Report deployment not started
        if: always() && steps.deployment.outcome == 'skipped'
        run: |
          @(
            '## Reflex Lab deployment',
            '- Result: NOT STARTED (check checkout/login logs)',
            '- URL: http://127.0.0.1:3000',
            "- Requested commit SHA: $env:GITHUB_SHA",
            '- Health: not checked; deployment script did not run'
          ) | Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
