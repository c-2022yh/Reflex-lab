name: HW3 Docker CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell

# Serialize runs that publish the same latest tag.
concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # There are no external dependencies or package lockfile.
      - name: Run tests
        run: |
          npm.cmd test
          exit $LASTEXITCODE
      - name: Check JavaScript syntax
        run: |
          node --check server.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check src/worker.mjs
          exit $LASTEXITCODE

  docker:
    needs: test
    runs-on: [self-hosted, Windows, X64]
    env:
      DOCKER_CONTEXT: desktop-linux
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            throw 'Configure the DOCKERHUB_USERNAME repository secret.'
          }
          $image = "${env:DOCKERHUB_USERNAME}/reflex-lab"
          docker build --build-arg "COMMIT_SHA=${env:GITHUB_SHA}" --tag "${image}:latest" --tag "${image}:${env:GITHUB_SHA}" .
          exit $LASTEXITCODE

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push commit SHA tag
        run: |
          docker push "${env:DOCKERHUB_USERNAME}/reflex-lab:${env:GITHUB_SHA}"
          exit $LASTEXITCODE

      - name: Push latest tag
        run: |
          docker push "${env:DOCKERHUB_USERNAME}/reflex-lab:latest"
          exit $LASTEXITCODE

  deploy:
    needs: docker
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      DOCKER_CONTEXT: desktop-linux
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v6
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Deploy and verify the commit image
        id: deployment
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/deploy-windows.ps1 -Image "${env:DOCKERHUB_USERNAME}/reflex-lab" -CommitSha $env:GITHUB_SHA
          exit $LASTEXITCODE
      - name: Report deployment not started
        if: always() && steps.deployment.outcome == 'skipped'
        run: |
          @(
            '## Reflex Lab deployment',
            '- Result: NOT STARTED (check checkout/login logs)',
            '- URL: http://127.0.0.1:3000',
            "- Requested commit SHA: $env:GITHUB_SHA",
            '- Health: not checked; deployment script did not run'
          ) | Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
